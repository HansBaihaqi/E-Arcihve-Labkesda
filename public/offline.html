<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - E-Archive Labkesda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-primary: #f3f4f6;
                --text-secondary: #9ca3af;
                --primary: #6366f1;
                --primary-hover: #4f46e5;
                --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background-color 0.3s ease;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow);
            text-align: center;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .icon-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5rem;
            height: 5rem;
            border-radius: 50%;
            background-color: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        @media (prefers-color-scheme: dark) {
            .icon-container {
                background-color: rgba(99, 102, 241, 0.15);
            }
        }

        .icon-container svg {
            width: 2.5rem;
            height: 2.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .btn-reload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
        }

        .btn-reload:hover {
            background-color: var(--primary-hover);
        }

        .btn-reload:active {
            transform: scale(0.98);
        }

        .btn-reload svg {
            margin-right: 0.5rem;
            width: 1.25rem;
            height: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <!-- SVG Icon: Cloud Offline / Wi-Fi Off -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M9.013 9.013A3.75 3.75 0 0112 8.25c.596 0 1.15.14 1.64.387M15.01 15.01A3.75 3.75 0 0112 15.75c-1.393 0-2.607-.756-3.25-1.879m6.26-6.261A7.452 7.452 0 0012 6.75a7.5 7.5 0 00-6.364 3.518m11.396 2.302A7.472 7.472 0 0112 17.25c-3.134 0-5.787-1.928-6.864-4.681M20.25 10.5c.348 0 .692.02 1.03.057M3.75 10.5c-.348 0-.692.02-1.03.057" />
            </svg>
        </div>
        <h1>Koneksi Terputus</h1>
        <p>Anda sedang tidak terhubung ke internet. Beberapa fitur mungkin tidak dapat diakses saat ini. Silakan periksa koneksi internet Anda dan coba lagi.</p>
        <button class="btn-reload" onclick="window.location.reload()">
            <!-- SVG Icon: Refresh -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
            Coba Lagi
        </button>
    </div>
</body>
</html>
